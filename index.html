<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冰与火之舞社区谱库 · ADOFAI Chart Hub</title>
    <meta name="description" content="冰与火之舞 (ADOFAI) 社区谱子收集与分享平台">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗡️</text></svg>">
</head>
<body>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <header class="site-header">
        <nav class="nav-container">
            <div class="logo">
                <span class="logo-icon">🗡️</span>
                <span class="logo-text">ADOFAI<span class="logo-accent">Hub</span></span>
            </div>
            <div class="nav-links">
                <a href="#" class="nav-link active" data-view="charts">谱库</a>
                <a href="#" class="nav-link" data-view="about">关于</a>
                <a href="https://github.com/" target="_blank" class="nav-link nav-github">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                </a>
            </div>
        </nav>
    </header>

    <main class="site-main">
        <section class="hero">
            <div class="hero-content">
                <h1 class="hero-title">
                    <span class="title-gradient">冰与火之舞</span>
                    <span class="title-sub">社区谱库</span>
                </h1>
                <p class="hero-desc">
                    收录来自 B站、抖音、快手、各大论坛的优质自制谱，让你一站式探索社区创作
                </p>
                <div class="hero-stats">
                    <div class="stat-card">
                        <span class="stat-value" id="stat-total">0</span>
                        <span class="stat-label">谱子总数</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value" id="stat-platforms">0</span>
                        <span class="stat-label">收录平台</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value" id="stat-updated">--</span>
                        <span class="stat-label">最近更新</span>
                    </div>
                </div>
            </div>
            <div class="hero-decoration">
                <div class="deco-ring ring-1"></div>
                <div class="deco-ring ring-2"></div>
                <div class="deco-ring ring-3"></div>
            </div>
        </section>

        <section class="controls">
            <div class="search-box">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
                </svg>
                <input type="text" id="search-input" placeholder="搜索曲目、艺术家、谱师...">
                <button class="clear-btn" id="search-clear" title="清除">×</button>
            </div>

            <div class="filter-group">
                <div class="filter-label">难度</div>
                <div class="filter-chips" id="difficulty-filter">
                    <button class="chip active" data-filter="difficulty" data-value="all">全部</button>
                    <button class="chip" data-filter="difficulty" data-value="1">Lv.1</button>
                    <button class="chip" data-filter="difficulty" data-value="3">Lv.3</button>
                    <button class="chip" data-filter="difficulty" data-value="5">Lv.5</button>
                    <button class="chip" data-filter="difficulty" data-value="7">Lv.7</button>
                    <button class="chip" data-filter="difficulty" data-value="9">Lv.9+</button>
                </div>
            </div>

            <div class="filter-group">
                <div class="filter-label">平台</div>
                <div class="filter-chips" id="platform-filter">
                    <button class="chip active" data-filter="platform" data-value="all">全部</button>
                    <button class="chip" data-filter="platform" data-value="bilibili">📺 B站</button>
                    <button class="chip" data-filter="platform" data-value="douyin">🎵 抖音</button>
                    <button class="chip" data-filter="platform" data-value="kuaishou">⚡ 快手</button>
                    <button class="chip" data-filter="platform" data-value="forum">💬 论坛</button>
                </div>
            </div>

            <div class="sort-group">
                <select id="sort-select">
                    <option value="date-desc">最新上传</option>
                    <option value="date-asc">最早上传</option>
                    <option value="difficulty-desc">难度从高到低</option>
                    <option value="difficulty-asc">难度从低到高</option>
                    <option value="title-asc">标题 A-Z</option>
                    <option value="artist-asc">艺术家 A-Z</option>
                </select>
            </div>
        </section>

        <section class="chart-grid-section">
            <div class="section-header">
                <h2 class="section-title">谱子列表</h2>
                <span class="section-count" id="result-count">0 个结果</span>
            </div>
            <div class="chart-grid" id="chart-grid"></div>
            <div class="empty-state" id="empty-state" style="display:none;">
                <div class="empty-icon">🎵</div>
                <h3>暂无谱子</h3>
                <p>爬虫正在持续收录中，稍后再来看看吧</p>
            </div>
        </section>
    </main>

    <div class="modal" id="chart-modal">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <button class="modal-close" id="modal-close">×</button>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <footer class="site-footer">
        <p>
            <strong>ADOFAI Chart Hub</strong> · 冰与火之舞社区谱库
        </p>
        <p class="footer-links">
            <a href="https://github.com/" target="_blank">GitHub</a>
            <span>·</span>
            <a href="#" id="api-link">API</a>
            <span>·</span>
            仅收集公开可下载的谱子，版权归原作者所有
        </p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
